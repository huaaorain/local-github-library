<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Local GitHub Library 功能流程示意</title>
  <desc id="desc">从 GitHub 搜索和公开榜单发现项目，保存 Star 快照，通过收藏和 README 摘要整理，再导出本地报告。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4ec"/>
      <stop offset="1" stop-color="#edf2e8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#8bcf32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e2b25" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <g font-family="Segoe UI, Microsoft YaHei UI, Noto Sans CJK SC, sans-serif">
    <text x="64" y="70" fill="#1e2b25" font-size="15" font-weight="750" letter-spacing="4">PRODUCT WORKFLOW · 功能流程示意</text>
    <text x="64" y="122" fill="#17231e" font-size="38" font-weight="760">从发现项目到形成自己的资料库</text>
    <line x1="64" y1="148" x2="300" y2="148" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)" font-family="Segoe UI, Microsoft YaHei UI, Noto Sans CJK SC, sans-serif">
    <rect x="64" y="194" width="238" height="258" rx="24" fill="#fffdf8" stroke="#d9e1d9"/>
    <circle cx="110" cy="240" r="20" fill="#ff7a45"/>
    <text x="110" y="247" fill="#fff" font-size="18" font-weight="800" text-anchor="middle">01</text>
    <text x="145" y="247" fill="#17231e" font-size="23" font-weight="750">搜索主题</text>
    <text x="92" y="295" fill="#5e6d65" font-size="16">GitHub Search API</text>
    <text x="92" y="326" fill="#5e6d65" font-size="16">关键词、数量与筛选</text>
    <rect x="92" y="363" width="180" height="42" rx="12" fill="#f1f5ef"/>
    <text x="182" y="390" fill="#263b31" font-size="15" font-weight="650" text-anchor="middle">仓库 + Star 元数据</text>
    <text x="92" y="430" fill="#829088" font-size="14">发现当前值得关注的项目</text>

    <rect x="335" y="194" width="238" height="258" rx="24" fill="#fffdf8" stroke="#d9e1d9"/>
    <circle cx="381" cy="240" r="20" fill="#ff9a67"/>
    <text x="381" y="247" fill="#fff" font-size="18" font-weight="800" text-anchor="middle">02</text>
    <text x="416" y="247" fill="#17231e" font-size="23" font-weight="750">观察增长</text>
    <text x="363" y="295" fill="#5e6d65" font-size="16">本地 Star 快照</text>
    <text x="363" y="326" fill="#5e6d65" font-size="16">7 天后计算增长</text>
    <path d="M363 403 C391 386 411 410 437 377 S490 383 512 359" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <text x="363" y="430" fill="#829088" font-size="14">区分当前热度与真实变化</text>

    <rect x="606" y="194" width="238" height="258" rx="24" fill="#fffdf8" stroke="#d9e1d9"/>
    <circle cx="652" cy="240" r="20" fill="#a7d95f"/>
    <text x="652" y="247" fill="#fff" font-size="18" font-weight="800" text-anchor="middle">03</text>
    <text x="687" y="247" fill="#17231e" font-size="23" font-weight="750">整理与理解</text>
    <text x="634" y="295" fill="#5e6d65" font-size="16">收藏目录与去重</text>
    <text x="634" y="326" fill="#5e6d65" font-size="16">README 摘要</text>
    <rect x="634" y="363" width="182" height="42" rx="12" fill="#f1f5ef"/>
    <text x="725" y="390" fill="#263b31" font-size="15" font-weight="650" text-anchor="middle">可选本地 LLM</text>
    <text x="634" y="430" fill="#829088" font-size="14">把公开信息变成可检索的资料</text>

    <rect x="877" y="194" width="259" height="258" rx="24" fill="#17231e" stroke="#263b31"/>
    <circle cx="923" cy="240" r="20" fill="#c5f36b"/>
    <text x="923" y="247" fill="#17231e" font-size="18" font-weight="800" text-anchor="middle">04</text>
    <text x="958" y="247" fill="#f7f4ec" font-size="23" font-weight="750">保存在本地</text>
    <text x="905" y="295" fill="#b2c0b8" font-size="16">TXT / JSON / JSONL / ZIP</text>
    <text x="905" y="326" fill="#b2c0b8" font-size="16">导入前自动备份</text>
    <rect x="905" y="363" width="203" height="42" rx="12" fill="#21352c"/>
    <text x="1007" y="390" fill="#c5f36b" font-size="15" font-weight="650" text-anchor="middle">.ghconfig 可迁移配置</text>
    <text x="905" y="430" fill="#7f9187" font-size="14">不依赖数据库或云端账户</text>
  </g>

  <path d="M302 322 H335" stroke="#95a39b" stroke-width="3"/>
  <path d="M573 322 H606" stroke="#95a39b" stroke-width="3"/>
  <path d="M844 322 H877" stroke="#95a39b" stroke-width="3"/>
  <g fill="#95a39b">
    <path d="M328 316 L336 322 L328 328 Z"/>
    <path d="M599 316 L607 322 L599 328 Z"/>
    <path d="M870 316 L878 322 L870 328 Z"/>
  </g>
  <text x="64" y="510" fill="#7a8980" font-size="14">依据项目公开功能说明绘制 · 用于解释工作流，不是软件界面截图</text>
</svg>
