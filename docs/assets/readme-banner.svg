<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Local GitHub Library</title>
  <desc id="desc">本地优先的 GitHub 项目发现、Star 趋势与个人收藏工作台</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101614"/>
      <stop offset="0.55" stop-color="#16201c"/>
      <stop offset="1" stop-color="#0d1211"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#c5f36b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="28" fill="url(#grid)"/>
  <circle cx="1070" cy="40" r="170" fill="#c5f36b" fill-opacity="0.055"/>
  <circle cx="1110" cy="355" r="150" fill="#ff7a45" fill-opacity="0.065"/>
  <path d="M64 318 H536" stroke="url(#signal)" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Segoe UI, Microsoft YaHei UI, Noto Sans CJK SC, sans-serif">
    <text x="64" y="74" fill="#c5f36b" font-size="17" font-weight="700" letter-spacing="4">WINDOWS · LOCAL-FIRST · OPEN DATA</text>
    <text x="64" y="154" fill="#f6f2e8" font-size="62" font-weight="760" letter-spacing="-2">LOCAL GITHUB</text>
    <text x="64" y="220" fill="#f6f2e8" font-size="62" font-weight="760" letter-spacing="-2">LIBRARY</text>
    <text x="66" y="269" fill="#aebbb5" font-size="21">发现值得关注的项目，观察 Star 增长，</text>
    <text x="66" y="300" fill="#aebbb5" font-size="21">并整理成自己的本地资料库。</text>
  </g>
  <g filter="url(#shadow)" font-family="Segoe UI, Microsoft YaHei UI, Noto Sans CJK SC, sans-serif">
    <rect x="670" y="82" width="420" height="212" rx="22" fill="#1b2722" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="694" y="105" width="372" height="46" rx="12" fill="#111816"/>
    <circle cx="716" cy="128" r="8" fill="#ff7a45"/>
    <text x="737" y="135" fill="#d9e2dd" font-size="15" font-weight="650">SEARCH / COMPARE / KEEP</text>
    <text x="727" y="184" fill="#83938b" font-size="12" font-weight="700" letter-spacing="2">DISCOVERY SIGNAL</text>
    <path d="M727 250 C760 238 775 257 808 228 S861 215 891 234 S944 231 971 190 S1018 201 1042 166" fill="none" stroke="url(#signal)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="1042" cy="166" r="8" fill="#c5f36b"/>
    <circle cx="1042" cy="166" r="16" fill="none" stroke="#c5f36b" stroke-opacity="0.35"/>
    <text x="726" y="277" fill="#f6f2e8" font-size="17" font-weight="700">GitHub API + local files</text>
    <rect x="956" y="237" width="112" height="33" rx="16.5" fill="#c5f36b" fill-opacity="0.12" stroke="#c5f36b" stroke-opacity="0.28"/>
    <text x="1012" y="259" fill="#c5f36b" font-size="13" font-weight="700" text-anchor="middle">LOCAL FIRST</text>
  </g>
  <g fill="#6f8077" font-family="Segoe UI, Microsoft YaHei UI, Noto Sans CJK SC, sans-serif">
    <text x="66" y="354" font-size="14">Repository discovery · Star movement · Personal library</text>
    <text x="1134" y="354" font-size="14" text-anchor="end">v0.2.0</text>
  </g>
</svg>
