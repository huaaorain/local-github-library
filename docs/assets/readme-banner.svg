<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="360"
     viewBox="0 0 1200 360"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Local GitHub Library</title>
  <desc id="desc">面向 Windows 的 GitHub 项目发现、Star 趋势、收藏与本地报告工作台</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e141d"/>
      <stop offset="0.58" stop-color="#151f2e"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fb6ff"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.035"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0"
                    dy="16"
                    stdDeviation="24"
                    flood-color="#020617"
                    flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#background)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <circle cx="1040" cy="42" r="150" fill="#8fb6ff" fill-opacity="0.08"/>
  <circle cx="1120" cy="340" r="140" fill="#4ade80" fill-opacity="0.06"/>

  <g font-family="Segoe UI, Microsoft YaHei UI, Noto Sans CJK SC, sans-serif">
    <text x="58" y="68"
          fill="#8fb6ff"
          font-size="15"
          font-weight="700"
          letter-spacing="3">WINDOWS · LIGHT + DARK · LOCAL-FIRST</text>
    <text x="58" y="142"
          fill="#f2f6fb"
          font-size="56"
          font-weight="760"
          letter-spacing="-2">LOCAL GITHUB</text>
    <text x="58" y="201"
          fill="#f2f6fb"
          font-size="56"
          font-weight="760"
          letter-spacing="-2">LIBRARY</text>
    <text x="60" y="250"
          fill="#b8c5d6"
          font-size="19">发现值得关注的项目，观察 Star 增长，</text>
    <text x="60" y="280"
          fill="#b8c5d6"
          font-size="19">并整理成自己的本地资料库。</text>
    <path d="M60 310 H518"
          stroke="url(#signal)"
          stroke-width="4"
          stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)"
     font-family="Segoe UI, Microsoft YaHei UI, Noto Sans CJK SC, sans-serif">
    <rect x="666" y="66"
          width="454"
          height="226"
          rx="20"
          fill="#151d28"
          stroke="#46566d"
          stroke-width="1.5"/>
    <rect x="688" y="88"
          width="410"
          height="46"
          rx="11"
          fill="#1b2634"
          stroke="#334155"/>
    <circle cx="711" cy="111" r="7" fill="#8fb6ff"/>
    <text x="730" y="116"
          fill="#d8e1ed"
          font-size="13"
          font-weight="650"
          letter-spacing="1.4">SEARCH · RANK · KEEP</text>

    <text x="706" y="161"
          fill="#8493a8"
          font-size="11"
          font-weight="700"
          letter-spacing="1.8">STAR SIGNAL</text>
    <path d="M706 218 C748 205 776 231 814 208 S868 184 902 203 S954 185 981 164 S1026 177 1058 139"
          fill="none"
          stroke="url(#signal)"
          stroke-width="5"
          stroke-linecap="round"/>
    <circle cx="1058" cy="139" r="7" fill="#4ade80"/>
    <circle cx="1058" cy="139" r="15"
            fill="none"
            stroke="#4ade80"
            stroke-opacity="0.38"/>

    <rect x="706" y="240"
          width="116"
          height="30"
          rx="15"
          fill="#8fb6ff"
          fill-opacity="0.12"
          stroke="#8fb6ff"
          stroke-opacity="0.35"/>
    <text x="764" y="260"
          fill="#8fb6ff"
          font-size="12"
          font-weight="700"
          text-anchor="middle">LIGHT · DARK</text>
    <rect x="834" y="240"
          width="126"
          height="30"
          rx="15"
          fill="#4ade80"
          fill-opacity="0.1"
          stroke="#4ade80"
          stroke-opacity="0.3"/>
    <text x="897" y="260"
          fill="#4ade80"
          font-size="12"
          font-weight="700"
          text-anchor="middle">LOCAL DATA</text>
    <text x="1098" y="260"
          fill="#f2f6fb"
          font-size="15"
          font-weight="700"
          text-anchor="end">v0.2.4</text>
  </g>

  <g fill="#718096"
     font-family="Segoe UI, Microsoft YaHei UI, Noto Sans CJK SC, sans-serif">
    <text x="60" y="340" font-size="13">Repository discovery · Star movement · Personal library</text>
    <text x="1142" y="340" font-size="13" text-anchor="end">WPF · .NET 10 · Windows x64</text>
  </g>
</svg>
