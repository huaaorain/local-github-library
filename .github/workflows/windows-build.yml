name: Windows Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\GitHubTopicReports.csproj -r win-x64

      - name: Build
        run: dotnet build .\GitHubTopicReports.csproj -c Release --no-restore

      - name: Publish
        run: .\publish.ps1

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: LocalGithubLibrary-win-x64
          path: dist/
          if-no-files-found: error
